name: ci

on:
  push:
  pull_request:

jobs:
  fast:
    name: fmt + clippy + pure-Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  native:
    name: projectM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git clang libclang-dev pkg-config \
            libegl1-mesa-dev libgl1-mesa-dev ffmpeg
      - run: cargo clippy --all-targets --features projectm -- -D warnings
      - run: cargo test --all-targets --features projectm --no-run
      - run: cargo build --features projectm

  docker:
    name: docker image
    runs-on: ubuntu-latest
    needs: [fast, native]
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      # Publish only for the default branch and version tags. Keep this a string
      # so the step conditions can compare it consistently.
      PUSH_IMAGE: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4

      # GHCR requires a lowercase image name. github.repository keeps the
      # owner's display case, so "Antervel/pmvid" becomes "ghcr.io/antervel/pmvid".
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH_IMAGE == 'true' }}
          load: ${{ env.PUSH_IMAGE != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
          docker run --rm "$image" --version
          docker run --rm "$image" --help >/dev/null
